apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-chart-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: nginx
      targetRevision: 13.0.0
    - repoURL: https://charts.bitnami.com/bitnami
      chart: redis
      targetRevision: 17.0.0
  destination:
    server: https://kubernetes.default.svc
    namespace: default
