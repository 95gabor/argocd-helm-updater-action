apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chart-with-values-ref
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: nginx
      targetRevision: 13.0.0
      helm:
        valueFiles:
          - "$values/apps/nginx/values.yaml"
    - repoURL: https://github.com/example-org/example-values.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
