name: integration

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "test/**"
      - "action.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "test/**"
      - "action.yaml"

jobs:
  shellcheck:
    name: ShellCheck updater script
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./src

  simple:
    name: Simple test with specified folders, recursive and colors
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: With dry-run
        id: dry-run
        uses: ./
        with:
          dry_run: true

      - name: Print output from dry-run
        run: 'echo "Updated files: ${{ steps.dry-run.outputs.updated_count }}"'

      - name: Without recursive
        uses: ./
        with:
          recursive: false

      - name: With specified directory
        uses: ./
        with:
          main_directory: ./test

      - name: Without colors
        uses: ./
        with:
          color_logs: false
