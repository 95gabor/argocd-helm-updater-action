name: integration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'action.yaml'
      - 'test/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'action.yaml'
      - 'test/**'

jobs:
  simple:
    name: Simple test with specified folders, recursive and colors
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: With dry-run
        uses: ./
        with:
          dry_run: true

      - name: Without recursive
        uses: ./
        with:
          recursive: false

      - name: With specified directory
        uses: ./
        with:
          main_directory: ./test

      - name: Without colors
        uses: ./
        with:
          color_logs: false

  oci-tests:
    name: OCI registry tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sSfL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /tmp/yq
          sudo install /tmp/yq /usr/local/bin/yq
          chmod +x test/*.sh

      - name: Run OCI detection tests
        run: |
          ./test/test-oci-detection.sh

      - name: Run integration tests
        run: |
          ./test/test-script.sh

      - name: Test with OCI files (dry-run)
        uses: ./
        with:
          main_directory: ./test
          recursive: true
          dry_run: true
