name: integration

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "test/**"
      - "action.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "test/**"
      - "action.yaml"

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck on src
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./src

      - name: Run ShellCheck on test scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./test/scripts

  simple:
    name: Simple test with specified folders, recursive and colors
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Run integration expectation tests
        run: bash test/scripts/run-integration-tests.sh

      - name: With dry-run
        id: dry-run
        uses: ./
        with:
          dry_run: true

      - name: Print output from dry-run
        run: 'echo "Updated files: ${{ steps.dry-run.outputs.updated_count }}"'

      - name: Without recursive
        uses: ./
        with:
          recursive: false

      - name: With specified directory
        uses: ./
        with:
          main_directory: ./test/fixtures

      - name: Without colors
        uses: ./
        with:
          color_logs: false
